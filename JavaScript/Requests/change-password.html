<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./auth.js"></script>
</head>
<body data-page="change-password">
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Usuarios</p>
      <h1>Cambiar contraseña</h1>
      <a class="secondary-link" href="./profile.html">← Volver al perfil</a>
    </header>
    <section class="card">
      <form id="changePasswordForm">
        <label>ID de usuario
          <input name="id" required>
        </label>
        <label>Contraseña anterior
          <input name="oldPassword" type="password" autocomplete="current-password" required>
        </label>
        <label>Nueva contraseña
          <input name="newPassword" type="password" autocomplete="new-password" required>
        </label>
        <label>Confirmar nueva contraseña
          <input name="confirmation" type="password" autocomplete="new-password" required>
        </label>
        <button type="submit">Actualizar contraseña</button>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>
  </main>
</body>
</html>
