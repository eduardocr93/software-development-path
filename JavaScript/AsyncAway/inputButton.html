<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscar Usuario</title>
</head>
<body>
  <h2>Buscar Usuario en ReqRes</h2>
  <input id="userId" type="number" placeholder="Ingrese ID de usuario">
  <button id="searchButton">Buscar</button>
  <div id="result"></div>

  <script>
    async function searchUser(id) {
      const result = document.getElementById("result");
      if (!id.trim()) {
        result.innerText = "Ingrese un ID de usuario";
        return;
      }

      try {
        const response = await fetch(`https://reqres.in/api/users/${id}`);
        if (!response.ok) throw new Error("Usuario no encontrado");
        const data = await response.json();
        const { first_name, last_name, email } = data.data;
        result.innerText = `${first_name} ${last_name} - ${email}`;
      } catch (error) {
        result.innerText = "❌ " + error.message;
      }
    }

    document.getElementById("searchButton").addEventListener("click", () => {
      const id = document.getElementById("userId").value;
      searchUser(id);
    });
  </script>
</body>
</html>
